<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guess Masters Pro 🎮</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    color: white;
    margin: 0;
    height: 100vh;
    background: 
        linear-gradient(rgba(10,10,30,0.7), rgba(10,10,30,0.9)),
        url("https://images.unsplash.com/photo-1535223289827-42f1e9919769");
    background-size: cover;
}

/* UI */
.game-box {
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    padding: 20px;
    margin-top: 40px;
    display: inline-block;
    border-radius: 15px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 0 20px rgba(0,255,255,0.3);
}

input {
    padding: 12px;
    border-radius: 10px;
    border: none;
    text-align: center;
    width: 80%;
    max-width: 250px;
}

button {
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: linear-gradient(45deg,#00c9ff,#92fe9d);
    font-weight: bold;
}
button:hover { transform: scale(1.05); }

.selected {
    background: lime !important;
    color: black;
}

.success { color:#00ffcc; }

.shake { animation: shake 0.3s; }
@keyframes shake {
    25%{transform:translateX(-5px);}
    50%{transform:translateX(5px);}
}

.win-effect { animation: glow 0.5s; }
@keyframes glow {
    from{box-shadow:0 0 10px cyan;}
    to{box-shadow:0 0 30px lime;}
}

.lose-life { animation: blink 0.4s; }
@keyframes blink {50%{opacity:0;}}
</style>
</head>

<body>

<div class="game-box">

<!-- HOME -->
<div id="home">
<h2>🎮 Guess Masters Pro</h2>
<p>Test your brain & beat the levels!</p>
<button onclick="goToSetup()">Start Game</button>
</div>

<!-- SETUP -->
<div id="setup" style="display:none;">
  <h2>⚙️ Game Setup</h2>

  <input id="name" placeholder="Enter your name"><br><br>

  <h3>Select Difficulty</h3>
  <button onclick="selectDifficulty(50)" id="easy">Easy</button>
  <button onclick="selectDifficulty(100)" id="medium">Medium</button>
  <button onclick="selectDifficulty(500)" id="hard">Hard</button>

  <br><br>
  <button onclick="startGame()">🚀 Start Game</button>
</div>

<!-- GAME -->
<div id="game" style="display:none;">
<h3 id="player"></h3>

<p id="info"></p>
<p>⏱️ <span id="timer"></span> | ❤️ <span id="lives"></span></p>
<p>🔥 Streak: <span id="streak"></span></p>
<p>🏆 Score: <span id="score"></span></p>

<input type="number" id="guessInput">
<button onclick="checkGuess()">Guess</button>
<button onclick="pauseGame()">⏸️ Pause</button>

<br>
<button onclick="useHint()">💡 Hint</button>
<button onclick="extraLife()">❤️ Life</button>
<button onclick="toggleMusic()">🎵 Music</button>

<p id="message"></p>
</div>

<!-- PAUSE SCREEN -->
<div id="pauseScreen" style="display:none;">
<h2>⏸️ Game Paused</h2>
<button onclick="resumeGame()">▶️ Resume</button>
</div>

<!-- BREAK -->
<div id="breakScreen" style="display:none;">
<h2>⏸️ Break</h2>
<p>Level <span id="breakLevel"></span></p>
<button onclick="continueGame()">Continue</button>
</div>

<!-- GAME OVER -->
<div id="gameOver" style="display:none;">
<h2>💀 Game Over</h2>
<p>Score: <span id="finalScore"></span></p>
<button onclick="restartGame()">Restart</button>
</div>

</div>

<!-- AUDIO -->
<audio id="correctSound" src="https://www.soundjay.com/buttons/sounds/button-4.mp3"></audio>
<audio id="wrongSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>
<audio id="bgMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

<script>
let number, attempts, maxAttempts, maxNumber;
let level=1, score=0, streak=0, lives=3;
let timeLeft, timer;
let paused=false;
let selectedDifficulty=50;

document.addEventListener("DOMContentLoaded",()=>{
document.getElementById("guessInput").addEventListener("keypress",e=>{
if(e.key==="Enter") checkGuess();
});
});

function goToSetup(){
document.getElementById("home").style.display="none";
document.getElementById("setup").style.display="block";
}

function selectDifficulty(value){
selectedDifficulty=value;

document.getElementById("easy").classList.remove("selected");
document.getElementById("medium").classList.remove("selected");
document.getElementById("hard").classList.remove("selected");

if(value===50) document.getElementById("easy").classList.add("selected");
if(value===100) document.getElementById("medium").classList.add("selected");
if(value===500) document.getElementById("hard").classList.add("selected");
}

function startGame(){
const name=document.getElementById("name").value||"Player";
maxNumber=selectedDifficulty;

document.getElementById("player").textContent=name;
document.getElementById("setup").style.display="none";
document.getElementById("game").style.display="block";

document.body.addEventListener("click",()=>{
document.getElementById("bgMusic").play();
},{once:true});

initLevel();
}

function initLevel(){
number=Math.floor(Math.random()*maxNumber)+1;
attempts=0;
maxAttempts=6+Math.floor(level/2);
startTimer(25-Math.min(level,10));
updateUI();
}

function updateUI(){
document.getElementById("info").textContent=`Level ${level}`;
document.getElementById("score").textContent=score;
document.getElementById("streak").textContent=streak;
document.getElementById("lives").textContent=lives;
}

function checkGuess(){
if(paused) return;

let input=document.getElementById("guessInput");
let guess=Number(input.value);
let msg=document.getElementById("message");

if(!guess) return msg.textContent="Enter number";

attempts++;

if(Math.abs(guess-number)<=5){
msg.textContent="🔥 Very close!";
}

if(guess<number){
msg.textContent="Too low!";
play("wrongSound"); shake();
}else if(guess>number){
msg.textContent="Too high!";
play("wrongSound"); shake();
}else{
msg.textContent="🎉 Correct!";
msg.className="success";

document.querySelector(".game-box").classList.add("win-effect");
setTimeout(()=>document.querySelector(".game-box").classList.remove("win-effect"),500);

play("correctSound");

score+=20+timeLeft*2;
streak++;
level++;

if(level%10===0){ showBreak(); return; }

setTimeout(initLevel,1000);
}

input.value="";

if(attempts>=maxAttempts) loseLife();
updateUI();
}

function loseLife(){
lives--;
if(lives<=0) showGameOver();
else initLevel();
}

function useHint(){
alert("Range: "+(number-5)+" to "+(number+5));
}

function extraLife(){ lives++; }

function startTimer(sec){
clearInterval(timer);
timeLeft=sec;
document.getElementById("timer").textContent=timeLeft;

timer=setInterval(()=>{
if(!paused){
timeLeft--;
document.getElementById("timer").textContent=timeLeft;
if(timeLeft<=0) loseLife();
}
},1000);
}

function pauseGame(){
paused=true;
clearInterval(timer);
document.getElementById("game").style.display="none";
document.getElementById("pauseScreen").style.display="block";
}

function resumeGame(){
paused=false;
document.getElementById("pauseScreen").style.display="none";
document.getElementById("game").style.display="block";
startTimer(timeLeft);
}

function showBreak(){
clearInterval(timer);
document.getElementById("game").style.display="none";
document.getElementById("breakScreen").style.display="block";
document.getElementById("breakLevel").textContent=level;
score+=50;
}

function continueGame(){
document.getElementById("breakScreen").style.display="none";
document.getElementById("game").style.display="block";
initLevel();
}

function showGameOver(){
document.getElementById("game").style.display="none";
document.getElementById("gameOver").style.display="block";
document.getElementById("finalScore").textContent=score;
}

function restartGame(){ location.reload(); }

function toggleMusic(){
let m=document.getElementById("bgMusic");
m.paused?m.play():m.pause();
}

function shake(){
let box=document.querySelector(".game-box");
box.classList.add("shake");
setTimeout(()=>box.classList.remove("shake"),300);
}

function play(id){ document.getElementById(id).play(); }
</script>

</body>
</html>
